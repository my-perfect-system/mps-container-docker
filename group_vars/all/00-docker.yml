---

# ---------------------------------------------------------------------------
# user defaults — set these once, referenced in every catalog entry below
# ---------------------------------------------------------------------------
user_shell: /bin/bash
user_create_home: true
user_system: false
user_expires: -1
user_groups: []
admin_groups: ["admin", "config"]
user_append_groups: true
user_password: "admin"

# ---------------------------------------------------------------------------
# user_roles_default — global default per-user role set
# ---------------------------------------------------------------------------
user_roles_default:
  terminal_bash: true
  terminal_vim: true
  terminal_nvim: true
  terminal_tmux: true
  terminal_kitty: true
  terminal_python: true
  terminal_rust: true
  terminal_scripts: true
  desktop_essentials: true
  desktop_lightdm: true
  desktop_rofi: true
  desktop_qtile: true
  desktop_thunar: true
  desktop_kanata: true
  backup_backup: true
  development_opencode: true
  development_lmstudio: true
  development_espidf: true
  development_dotnet: true
  development_java: true
  development_latex: true
  development_unity: true

sudo_macros:
  ADMIN_DEFAULT:
    - "/usr/bin/apt"
    - "/usr/bin/systemctl"
    - "/usr/bin/journalctl *"
    - "/usr/bin/df *"
    - "/usr/bin/du *"
    - "/usr/sbin/lsblk *"
    - "/usr/bin/netstat *"
    - "/usr/bin/which *"
    - "/usr/bin/cat /etc/hosts"
    - "/usr/bin/cat /etc/resolv.conf"
    - "/usr/bin/cat /etc/network/interfaces"
    - "/usr/sbin/route -n"
    - "/usr/sbin/iptables -L *"
    - "/usr/sbin/brctl show *"
    - "/usr/sbin/poweroff"
    - "/usr/sbin/reboot"
  ADMIN_DEBUG:
    - "/bin/sh *"
    - "/bin/bash *"
    - "/usr/bin/apt *"
    - "/usr/lib/apt/methods/http *"
    - "/usr/bin/rsync *"
    - "/usr/bin/cp *"
    - "/usr/bin/rm *"
    - "/usr/bin/mv *"
    - "/usr/bin/ln *"
    - "/usr/bin/mount *"
    - "/usr/bin/umount *"
    - "/usr/bin/tee *"
    - "/usr/bin/batcat *"
    - "/usr/bin/cat *"
    - "/usr/bin/vi *"
    - "/usr/bin/vim *"
    - "/usr/bin/nano *"
    - "/usr/sbin/route *"
    - "/usr/sbin/iptables *"
    - "/usr/sbin/brctl *"
  ADMIN_MINIMAL:
    - "/usr/bin/su -"

users_list:
  - name: admin

users_catalog:
  admin:
    name: admin
    uid: 1000
    group: admin
    groups:
      - sudo
      - adm
      - systemd-journal
    shell: /bin/bash
    home: /home/admin
    create_home: true
    comment: "Container bootstrap admin"
    password: "{{ 'admin' | password_hash('sha512') }}"
    user_roles: "{{ user_roles_default }}"
    sudo:
      macros:
        - ADMIN_DEFAULT
        - ADMIN_DEBUG
